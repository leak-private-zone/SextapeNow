<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SextapeNow</title>
    
    <!-- COLLE TON CODE MONETAG ICI -->
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: Arial, sans-serif; }
        
        .age-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .age-gate h1 { color: #e50914; font-size: 32px; margin-bottom: 10px; }
        .age-gate p { color: #aaa; margin-bottom: 25px; }
        .age-gate button {
            padding: 14px 40px; margin: 8px; font-size: 17px; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 220px;
        }
        .btn-enter { background: #e50914; color: #fff; }
        .btn-leave { background: #222; color: #777; }
        
        .header {
            background: #0d0d0d; padding: 15px; text-align: center;
            border-bottom: 2px solid #e50914; position: sticky; top: 0; z-index: 100;
        }
        .header h2 { color: #e50914; font-size: 22px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        
        .video-box {
            background: #111; border-radius: 5px; overflow: hidden;
            aspect-ratio: 16/9; position: relative; cursor: pointer;
        }
        .video-box iframe {
            width: 100%; height: 100%; border: none; pointer-events: none;
        }
        .video-box .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; z-index: 10;
        }
        .video-box .play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: rgba(229,9,20,0.8); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            z-index: 5; pointer-events: none;
        }
        
        .player-full {
            display: none; background: #000; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 200;
        }
        .player-full.active { display: block; }
        .player-full iframe { width: 100%; height: 100%; border: none; }
        .close-full {
            position: absolute; top: 15px; right: 15px; z-index: 210;
            background: #e50914; color: #fff; border: none;
            padding: 10px 20px; border-radius: 5px; font-size: 18px; cursor: pointer;
        }
        
        .footer {
            text-align: center; padding: 25px; color: #555; font-size: 12px;
            border-top: 1px solid #1a1a1a; margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- VÉRIFICATION D'ÂGE -->
    <div class="age-gate" id="ageGate">
        <h1>🔞 SextapeNow</h1>
        <p>Contenu réservé aux adultes de plus de 18 ans.</p>
        <button class="btn-enter" onclick="document.getElementById('ageGate').style.display='none'">✅ J'ai 18 ans ou plus</button>
        <button class="btn-leave" onclick="window.location.href='https://google.com'">🚫 Je suis mineur</button>
    </div>

    <!-- HEADER -->
    <div class="header">
        <h2>🔥 SextapeNow</h2>
    </div>

    <!-- GRILLE DE VIDÉOS -->
    <div class="grid">
        
        <!-- VIDÉO 1 -->
        <div class="video-box" onclick="openFull('player1')">
            <iframe src="https://www.eporner.com/embed/vRLUPhxIlZI/" allowfullscreen></iframe>
            <div class="overlay"></div>
            <div class="play-btn">▶</div>
        </div>
        <div class="video-box" onclick="openFull('player2')">
    <iframe width="608" height="1080" src="https://www.eporner.com/embed/e72zuOmEBEe/" frameborder="0" allowfullscreen></iframe>
    <div class="overlay"></div>
    <div class="play-btn">▶</div>
</div>
<!-- VIDÉO -->
<div class="video-box" onclick="openFull('player3')">
    <iframe width="480" height="854" src="https://www.eporner.com/embed/NPI3OAIuMvz/" frameborder="0" allowfullscreen></iframe>
    <div class="overlay"></div>
    <div class="play-btn">▶</div>
</div>
<!-- VIDÉO -->
<div class="video-box" onclick="openFull('player4')">
    <iframe width="352" height="640" src="https://www.eporner.com/embed/Sr3sCrAVNoO/" frameborder="0" allowfullscreen></iframe>
    <div class="overlay"></div>
    <div class="play-btn">▶</div>
</div>
<!-- VIDÉO -->
<div class="video-box" onclick="openFull('player5')">
    <iframe src="https://www.eporner.com/embed/xyz789/" allowfullscreen></iframe>
    <div class="overlay"></div>
    <div class="play-btn">▶</div>
</div>
        <!-- AJOUTE D'AUTRES VIDÉOS ICI EN COPIANT LE BLOC CI-DESSUS -->
        
    </div>

    <!-- LECTEUR PLEIN ÉCRAN -->
    <div class="player-full" id="playerFull">
        <button class="close-full" onclick="closeFull()">✕ FERMER</button>
        <div id="playerContent"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        SextapeNow © 2026 - Tous droits réservés
    </div>

    <script>
        function openFull(id) {
            // Récupérer le code de la vidéo cliquée
            var videoBox = document.getElementById(id).parentElement;
            var iframe = videoBox.querySelector('iframe');
            var src = iframe.getAttribute('src');
            
            // Créer un nouvel iframe plein écran
            var fullIframe = '<iframe src="' + src + '" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>';
            
            // Afficher dans le lecteur plein écran
            document.getElementById('playerContent').innerHTML = fullIframe;
            document.getElementById('playerFull').classList.add('active');
        }
        
        function closeFull() {
            document.getElementById('playerFull').classList.remove('active');
            document.getElementById('playerContent').innerHTML = '';
        }
    </script>

</body>
</html>
