<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SextapeNow</title>
    
    <!-- COLLE TON CODE MONETAG ICI -->
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: Arial, sans-serif; }
        
        .age-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .age-gate h1 { color: #e50914; font-size: 32px; margin-bottom: 10px; }
        .age-gate p { color: #aaa; margin-bottom: 25px; }
        .age-gate button {
            padding: 14px 40px; margin: 8px; font-size: 17px; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 220px;
        }
        .btn-enter { background: #e50914; color: #fff; }
        .btn-leave { background: #222; color: #777; }
        
        .header {
            background: #0d0d0d; padding: 15px; text-align: center;
            border-bottom: 2px solid #e50914; position: sticky; top: 0; z-index: 100;
        }
        .header h2 { color: #e50914; font-size: 22px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        
        .video-box {
            background: #111; border-radius: 5px; overflow: hidden;
            aspect-ratio: 16/9; position: relative; cursor: pointer;
        }
        .video-box iframe {
            width: 100%; height: 100%; border: none; pointer-events: none;
            position: absolute; top: 0; left: 0;
        }
        .video-box .play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: rgba(229,9,20,0.8); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            z-index: 5; pointer-events: none;
        }
        
        .player-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9998;
            justify-content: center; align-items: center;
        }
        .player-overlay.active { display: flex; }
        .player-overlay iframe {
            width: 100%; height: 100%; border: none;
        }
        .close-btn {
            position: absolute; top: 15px; right: 15px; z-index: 9999;
            background: #e50914; color: #fff; border: none;
            padding: 10px 20px; border-radius: 5px; font-size: 18px; cursor: pointer;
        }
        
        .footer {
            text-align: center; padding: 25px; color: #555; font-size: 12px;
            border-top: 1px solid #1a1a1a; margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- VÉRIFICATION D'ÂGE -->
    <div class="age-gate" id="ageGate">
        <h1>🔞 SextapeNow</h1>
        <p>Contenu réservé aux adultes de plus de 18 ans.</p>
        <button class="btn-enter" onclick="document.getElementById('ageGate').style.display='none'">✅ J'ai 18 ans ou plus</button>
        <button class="btn-leave" onclick="window.location.href='https://google.com'">🚫 Je suis mineur</button>
    </div>

    <!-- HEADER -->
    <div class="header">
        <h2>🔥 SextapeNow</h2>
    </div>

    <!-- GRILLE -->
    <div class="grid" id="videoGrid">
        
        <!-- VIDÉO 1 -->
        <div class="video-box" data-url="https://www.eporner.com/embed/vRLUPhxIlZI/">
            <iframe src="https://www.eporner.com/embed/vRLUPhxIlZI/" allowfullscreen></iframe>
            <div class="play-btn">▶</div>
        </div>
        <!-- VIDÉO -->
<div class="video-box" data-url="LIEN-DE-TA-VIDEO">
    <iframe width="480" height="854" src="https://www.eporner.com/embed/NPI3OAIuMvz/" frameborder="0" allowfullscreen></iframe>
    <div class="play-btn">▶</div>
</div>
        
        <!-- AJOUTE TES VIDÉOS ICI -->
        
    </div>

    <!-- LECTEUR PLEIN ÉCRAN -->
    <div class="player-overlay" id="playerOverlay">
        <button class="close-btn" onclick="closePlayer()">✕ FERMER</button>
        <iframe id="playerFrame" src="" allowfullscreen></iframe>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        SextapeNow © 2026 - Tous droits réservés
    </div>

    <script>
        document.getElementById('videoGrid').addEventListener('click', function(e) {
            var box = e.target.closest('.video-box');
            if (!box) return;
            
            var url = box.getAttribute('data-url');
            
            document.getElementById('playerFrame').setAttribute('src', url);
            document.getElementById('playerOverlay').classList.add('active');
        });
        
        function closePlayer() {
            document.getElementById('playerOverlay').classList.remove('active');
            document.getElementById('playerFrame').setAttribute('src', '');
        }
    </script>

</body>
</html>
